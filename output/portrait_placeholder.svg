<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334D92"/>
      <stop offset="100%" stop-color="#6BA3F7"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D7C8"/>
      <stop offset="100%" stop-color="#E4B6A0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512,560)" filter="url(#shadow)">
    <!-- shoulders and torso (clothed) -->
    <path d="M -260 220 C -220 80 -80 0 0 0 C 80 0 220 80 260 220 L 260 280 L -260 280 Z" fill="url(#shirt)"/>
    <!-- neck -->
    <rect x="-50" y="-40" width="100" height="90" rx="20" fill="url(#skin)"/>
    <!-- head -->
    <ellipse cx="0" cy="-190" rx="150" ry="180" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M -170 -260 C -120 -360 120 -360 170 -260 C 195 -180 140 -60 100 -20 C 80 -5 30 -10 0 -10 C -30 -10 -80 -5 -100 -20 C -140 -60 -195 -180 -170 -260 Z" fill="#1F2937"/>
    <!-- simple facial hint (no detail) -->
    <circle cx="-40" cy="-210" r="8" fill="#C08E7A" opacity="0.6"/>
    <circle cx="40" cy="-210" r="8" fill="#C08E7A" opacity="0.6"/>
    <rect x="-40" y="-160" width="80" height="10" rx="5" fill="#C08E7A" opacity="0.6"/>
  </g>
  <!-- frame -->
  <rect x="24" y="24" width="976" height="976" fill="none" stroke="white" stroke-opacity="0.6" stroke-width="6"/>
  <text x="50%" y="960" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#E6EEF9" opacity="0.9">SFW Portrait Placeholder — 1024×1024</text>
</svg>
